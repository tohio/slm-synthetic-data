run_name: "__RUN_NAME__"
output_dir: "__OUTPUT_DIR__"

target_total_tokens: __TARGET_TOKENS__

# Completion is measured after validation and global deduplication from public
# training text only. Rejected and duplicate candidates do not count.

backend:
  provider: "openrouter"
  model: "__MODEL__"
  max_tokens: __MAX_TOKENS__
  temperature: __TEMPERATURE__
  top_p: __TOP_P__
  json_mode: true
  request_timeout_seconds: 300
  require_parameters: true
  allow_fallbacks: false
  parallel_requests: __CONCURRENCY__
  retries:
    max_request_retries: 3
    max_retryable_request_attempts: 20
    retry_max_elapsed_seconds: 1800
    retry_sleep_seconds: 0.5
    retry_backoff_initial_seconds: 2.0
    retry_backoff_max_seconds: 120.0
    retry_backoff_multiplier: 2.0
    retry_jitter_ratio: 0.30
    # CONCURRENCY is a ceiling; adaptive admission discovers live provider capacity.
    adaptive_concurrency_enabled: true
    adaptive_initial_in_flight: 8
    adaptive_minimum_in_flight: 1
    # Before the first throttle burst, double after one fully successful live window.
    adaptive_slow_start_enabled: true
    adaptive_slow_start_multiplier: 2.0
    # After any throttle burst, recover conservatively with AIMD increases.
    adaptive_increase_successes_per_step: 64
    adaptive_increase_step: 16
    adaptive_rate_limit_burst_threshold: 4
    adaptive_rate_limit_window_seconds: 2.0
    adaptive_rate_limit_decrease_factor: 0.50
    # Catch prolonged throttling even when 429 responses are spread beyond the burst window.
    adaptive_sustained_rate_limit_attempt_window: 60
    adaptive_sustained_rate_limit_threshold: 20
    adaptive_cooldown_initial_seconds: 5.0
    adaptive_cooldown_max_seconds: 60.0
    adaptive_cooldown_multiplier: 2.0

# Locked raw-token allocation for the 762.5M corpus target:
#   task_code                    300.0M (39.3442623%)
#   educational_qa_mcq_general  187.5M (24.5901639%)
#   arithmetic                  112.5M (14.7540984%)
#   educational_qa_mcq_math     112.5M (14.7540984%)
#   factual_restraint            50.0M ( 6.5573770%)
# For smaller test TOKENS values, the same shares are used to derive estimated record counts.
# Candidate planning estimates are calibrated from the 100,000 accepted-token
# quality smoke. Fractional values avoid systematic row-count inflation:
#   arithmetic=82.69, task_code=291.21, educational_qa_mcq_math=74.72,
#   educational_qa_mcq_general=150.99, factual_restraint=61.45.
mix:
  arithmetic:
    architecture: "grounded"
    share: 0.14754098360655737
    # Finite high-quality source capacity; do not pad arithmetic with operand-only variants.
    max_unique_candidates: 288
    renderer_model: "__MODEL__"
    batch_size: __BATCH_SIZE__
    max_tokens: __MAX_TOKENS__
    avg_tokens_per_sample: 82.69
  task_code:
    architecture: "grounded"
    share: 0.39344262295081966
    # Finite catalog of genuinely different algorithms; do not pad with renamed variants.
    max_unique_candidates: 200
    renderer_model: "__MODEL__"
    batch_size: __BATCH_SIZE__
    max_tokens: __MAX_TOKENS__
    avg_tokens_per_sample: 291.21
  educational_qa_mcq_math:
    architecture: "grounded"
    share: 0.14754098360655737
    # Eleven grounded contexts for each verified relationship provide replacement headroom.
    max_unique_candidates: 264
    renderer_model: "__MODEL__"
    batch_size: __BATCH_SIZE__
    max_tokens: __MAX_TOKENS__
    avg_tokens_per_sample: 74.72
  educational_qa_mcq_general:
    architecture: "grounded"
    share: 0.24590163934426230
    # Nine evidence-document forms for each reasoning family; every candidate remains locally answerable.
    max_unique_candidates: 216
    renderer_model: "__MODEL__"
    batch_size: __BATCH_SIZE__
    max_tokens: __MAX_TOKENS__
    avg_tokens_per_sample: 150.99
  factual_restraint:
    architecture: "grounded"
    share: 0.06557377049180328
    # Four materially different scenarios for each restraint behavior.
    max_unique_candidates: 128
    renderer_model: "__MODEL__"
    batch_size: __BATCH_SIZE__
    max_tokens: __MAX_TOKENS__
    avg_tokens_per_sample: 61.45

validation:
  schema: true

dedup:
  mode: "global_exact_and_near_duplicate"
  enable_exact: true
  enable_fuzzy: true
  fuzzy_enabled: true
  near_duplicate_threshold: 0.80
  shingle_size: 5

export:
  license: mit
  push_to_hf: true
  hf_repo: "__HF_REPO__"
  private: false
  include_manifests: true

generation:
  batch_size: __BATCH_SIZE__
  parallel_requests: __CONCURRENCY__
  avg_tokens_per_sample: 100
  chars_per_token: 4.0
  # Optional hard generation-cost stop. Omit for no cost ceiling.
  # max_cost_usd: 10.0
  # Candidate rounds use estimated record counts and complete request batches;
  # only accepted public-text tokens determine corpus completion.
